<title>Patty POS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=DM+Sans:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#fff9ef;--sf:#fffefa;--ink:#241b16;--navy:#172d68;--mut:#786d62;--berry:#28499c;--berry2:#172d68;--line:#eadfce;--yel:#ffd45c;--hd:#fff9efe8;--dot:#f7eddd;--rose:#e97882;--bad:#c9485a;--ok:#5d7f45;--sh:0 14px 40px rgba(45,35,20,.08);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1634;--sf:#17234f;--ink:#f4efe6;--navy:#f4efe6;--mut:#a9b3d6;--line:#2b3a6b;--berry:#7f9cf0;--berry2:#5f80e6;--hd:#0e1634e8;--dot:#111c42;--rose:#ee8c95;--bad:#ff8fa0;--ok:#8fd4a0;--sh:0 14px 40px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1634;--sf:#17234f;--ink:#f4efe6;--navy:#f4efe6;--mut:#a9b3d6;--line:#2b3a6b;--berry:#7f9cf0;--berry2:#5f80e6;--hd:#0e1634e8;--dot:#111c42;--rose:#ee8c95;--bad:#ff8fa0;--ok:#8fd4a0;--sh:0 14px 40px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:15px/1.35 "DM Sans",ui-rounded,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:Fredoka,system-ui,sans-serif;margin:0}h2{font-size:24px;margin-bottom:8px}h3{font-size:17px;margin:14px 0 6px}
#app{display:flex;align-items:stretch;min-height:100%}
aside{width:224px;flex:none;padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#143a9c,#0c1f66);color:#fff;overflow:hidden}
aside.c{width:72px}aside.c .lb,aside.c #logo small,aside.c #sfoot{display:none}
.mk{display:none}aside.c .fn{display:none}aside.c .mk{display:block;text-align:center}aside.c #logo{padding:6px 0 10px;font-size:26px}aside.c #logo i{width:32px;margin:6px auto 0}@media(max-width:760px){.mk{display:block;text-align:center}.fn{display:none}#logo{padding:6px 0 10px;font-size:26px}#logo i{width:32px;margin:6px auto 0}}
#logo{font:800 30px/.95 Fredoka,system-ui,sans-serif;padding:6px 8px 14px;letter-spacing:-.5px}#logo small{display:block;font:700 10px "DM Sans",system-ui,sans-serif;letter-spacing:.2em;margin-top:6px;color:#cfe0ff}#logo i{display:block;width:70px;height:4px;border-radius:9px;background:var(--yel);margin-top:6px}
#nav{display:flex;flex-direction:column;gap:4px;margin-top:6px;overflow:auto}
aside button{width:100%;text-align:left;display:flex;gap:12px;align-items:center;justify-content:flex-start;background:transparent;color:#fff;border:0;box-shadow:none;border-radius:14px;font-weight:700;padding:11px 14px}
aside button:hover{background:#ffffff1f}aside button.on{background:var(--yel);color:#0d1d4d}
aside.c button{justify-content:center;padding:11px 0}
#sfoot{margin-top:auto;font:italic 800 17px/1.15 Fredoka,ui-rounded,system-ui,sans-serif;color:#fff;padding:14px 8px 4px;transform:rotate(-4deg);transform-origin:left}
.wrapm{flex:1;min-width:0}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--hd);border-bottom:1px solid var(--line);margin-bottom:16px;position:sticky;top:0;z-index:5}
h1{font-size:20px;line-height:1.1}h1 small{display:block;font:600 12px "DM Sans",system-ui,sans-serif;color:var(--mut);margin-top:2px}
.pill{font-size:13px;font-weight:800;padding:5px 12px;border-radius:99px;background:#1e3fa01a;color:var(--ink)}.pill.w{background:var(--yel);color:#0d1d4d}
button{font:inherit;font-weight:800;cursor:pointer;border:1.5px solid var(--line);background:var(--sf);color:var(--ink);border-radius:14px;padding:8px 14px;min-height:42px;box-shadow:0 2px 0 var(--line);transition:transform .08s}
button:active{transform:translateY(2px);box-shadow:none}button:disabled{opacity:.4;cursor:not-allowed}
button.on{background:var(--yel);border-color:var(--yel);color:#0d1d4d}
button.pri{background:linear-gradient(180deg,#ffd96b,var(--yel));border-color:#e9ad1c;color:#0d1d4d;box-shadow:0 4px 0 #e9ad1c;width:100%;font-size:18px;min-height:54px}
button.sm{min-height:32px;padding:2px 11px;font-size:13px;border-radius:99px}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
input,select,textarea{font:inherit;padding:9px 11px;border:1.5px solid var(--line);border-radius:12px;width:100%;background:var(--sf);color:var(--ink);min-width:0}
td input,td select{padding:5px 7px;min-width:70px}td input[type=checkbox]{width:20px;min-width:0;height:20px}
main{padding:0 20px 30px}
.sell{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
@media(max-width:900px){.sell,.ovg{grid-template-columns:1fr!important}aside{width:72px}aside .lb,#logo small,#sfoot{display:none}aside button{justify-content:center;padding:11px 0}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:12px}
.tile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;border-radius:20px;padding:10px 8px;min-height:150px;border:1px solid var(--line);box-shadow:var(--sh);background:var(--sf)}
.tile:hover{transform:translateY(-2px)}.tile img{width:92px;height:92px;object-fit:contain}.tile .th{font-size:44px}
.tile small{color:var(--mut)}.tile.low small{color:var(--bad)}.tile.out{opacity:.5;filter:grayscale(1)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.box{background:var(--sf);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.ln{display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
